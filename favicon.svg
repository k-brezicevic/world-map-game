<svg xmlns="http://www.w3.org/2000/svg" viewBox="73 101 900 900" width="900" height="900">
  <!-- World Map Game icon: a map pin ("find the place") in the game's
       orange highlight colour - the colour of a picked country - on a
       raised tile like the page's buttons (dark blue gradient, lighter top
       edge, darker bottom edge, lit from the top-left), with a soft
       shadow under the pin's tip. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a4563"/>
      <stop offset="1" stop-color="#14233a"/>
    </linearGradient>
    <linearGradient id="tileEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d6888"/>
      <stop offset="0.5" stop-color="#22344a"/>
      <stop offset="1" stop-color="#0a1320"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6bd5d"/>
      <stop offset="1" stop-color="#d98a20"/>
    </linearGradient>
  </defs>
  <rect x="91" y="119" width="864" height="864" rx="190" fill="url(#tile)" stroke="url(#tileEdge)" stroke-width="18"/>
  <rect x="112" y="140" width="822" height="822" rx="172" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="8"/>
  <!-- Pin and its shadow, scaled up 15% around the tile's centre. -->
  <g transform="translate(523 551) scale(1.15) translate(-523 -551)">
    <ellipse cx="523" cy="850" rx="120" ry="30" fill="#000" fill-opacity="0.35"/>
    <path d="M523 840 C458 742 323 618 323 465 A200 200 0 1 1 723 465 C723 618 588 742 523 840 Z M523 545 A80 80 0 1 0 523 385 A80 80 0 1 0 523 545 Z" fill="url(#orange)" fill-rule="evenodd" stroke="#0b1117" stroke-opacity="0.5" stroke-width="10"/>
  </g>
</svg>
