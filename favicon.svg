<svg xmlns="http://www.w3.org/2000/svg" viewBox="73 101 900 900" width="900" height="900">
  <!-- World Map Game icon: a globe in the game's colours, lit from the
       top-left like the page's buttons. Continent outlines from the
       previous icon. -->
  <defs>
    <clipPath id="globe"><circle cx="523" cy="551" r="440"/></clipPath>
    <!-- Ocean: lighter where the light hits (top-left), deep navy at the edge. -->
    <radialGradient id="ocean" cx="0.36" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#2e4b68"/>
      <stop offset="0.55" stop-color="#16273a"/>
      <stop offset="1" stop-color="#0a131d"/>
    </radialGradient>
    <!-- Land: slate blue, lighter towards the top-left. -->
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b4c6d8"/>
      <stop offset="1" stop-color="#6c859f"/>
    </linearGradient>
    <!-- Shading over everything: clear in the lit area, darker towards the
         bottom-right, so the globe looks round. -->
    <radialGradient id="shade" cx="0.34" cy="0.3" r="0.8">
      <stop offset="0.45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>
    <!-- Soft highlight near the top-left. -->
    <radialGradient id="shine" cx="0.32" cy="0.26" r="0.32">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <!-- Rim: light along the top-left edge, darker along the bottom-right, but
         never near-black, so the globe keeps an outline on dark tab bars. -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fb6cc"/>
      <stop offset="0.5" stop-color="#5a7189"/>
      <stop offset="1" stop-color="#34475b"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#globe)">
    <circle cx="523" cy="551" r="440" fill="url(#ocean)"/>
